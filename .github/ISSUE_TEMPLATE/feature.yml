name: Feature request
description: Propose a scoped product or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core metrics
        - macOS integration
        - Overlay or UI
        - Storage or export
        - Distribution
        - Linux (future)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Explain what new data is observed, retained, displayed, or exported.
      placeholder: No new data; uses existing daily aggregates.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I checked the product specification and working plan.
          required: true

name: Bug report
description: Report a reproducible QRY problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Never include typed text, passwords, individual keys, or sensitive input
        diagnostics in a report.
  - type: input
    id: version
    attributes:
      label: QRY version or commit
      placeholder: v0.1.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Linux X11 (future)
        - Linux Wayland (future/limited)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating-system version
      placeholder: macOS 15.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observable behavior without sharing typed content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start QRY
        2. Enable ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional non-sensitive context
      description: Do not attach raw keyboard-event logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed typed content, passwords, keys and sensitive event logs.
          required: true

name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata and source
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TypePulse/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: TypePulse -> target

      - name: Install frontend dependencies
        working-directory: TypePulse
        run: npm ci

      - name: Verify tag and version metadata
        run: ./scripts/release-audit.sh "$GITHUB_REF_NAME"

      - name: Run quality and privacy gate
        run: ./scripts/check.sh

  build:
    name: Build ${{ matrix.artifact_arch }}
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_arch: aarch64
          - target: x86_64-apple-darwin
            artifact_arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TypePulse/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: TypePulse -> target

      - name: Install frontend dependencies
        working-directory: TypePulse
        run: npm ci

      - name: Build, verify, archive and checksum
        run: ./scripts/package-macos.sh "${{ matrix.target }}"

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v7
        with:
          name: typepulse-${{ matrix.artifact_arch }}
          if-no-files-found: error
          path: |
            release/TypePulse-*.app.zip
            release/TypePulse-*.app.zip.sha256

  draft-release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --draft
          --generate-notes
          --repo "$GITHUB_REPOSITORY"
          --title "TypePulse $GITHUB_REF_NAME"
          --verify-tag

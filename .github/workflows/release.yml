name: Release desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to prepare as a draft (for example v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release metadata and source
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: QRY/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-validation-macos
          workspaces: QRY -> target

      - name: Install frontend dependencies
        working-directory: QRY
        run: npm ci

      - name: Verify tag, versions and installer policy
        run: ./scripts/release-audit.sh "$RELEASE_TAG"

      - name: Run quality and privacy gate
        run: ./scripts/check.sh

  build-macos:
    name: Build macOS ${{ matrix.artifact_arch }}
    needs: validate
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_arch: aarch64
          - target: x86_64-apple-darwin
            artifact_arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: QRY/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          workspaces: QRY -> target

      - name: Install frontend dependencies
        working-directory: QRY
        run: npm ci

      - name: Build, verify, archive and checksum
        run: ./scripts/package-macos.sh "${{ matrix.target }}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: qry-macos-${{ matrix.artifact_arch }}
          if-no-files-found: error
          path: |
            release/QRY-*.app.zip
            release/QRY-*.app.zip.sha256

  build-windows:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: QRY/package-lock.json

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x86_64
          workspaces: QRY -> target

      - name: Install frontend dependencies
        working-directory: QRY
        run: npm ci

      - name: Build NSIS and MSI installers
        working-directory: QRY
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles "nsis,msi"

      - name: Verify, normalize and checksum installers
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qry-windows-x64
          if-no-files-found: error
          path: |
            release/QRY_*_x64-setup.exe
            release/QRY_*_x64-setup.exe.sha256
            release/QRY_*_x64_en-US.msi
            release/QRY_*_x64_en-US.msi.sha256

  draft-release:
    name: Create one draft GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository scripts
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: Audit names and checksums
        run: node scripts/audit-release-assets.mjs release-assets "${RELEASE_TAG#v}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            release_flags+=(--verify-tag)
          else
            release_flags+=(--target "$GITHUB_SHA")
          fi
          notes_path="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes_path" ]]; then
            release_flags+=(--notes-file "$notes_path")
          else
            release_flags+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            "${release_flags[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "QRY $RELEASE_TAG"

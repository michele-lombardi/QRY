[package]
name = "typepulse-app"
version.workspace = true
description = "Privacy-first typing rhythm visualizer for macOS"
edition.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typepulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typepulse-core = { path = "../crates/typepulse-core" }
typepulse-platform-macos = { path = "../crates/typepulse-platform-macos" }
typepulse-storage-sqlite = { path = "../crates/typepulse-storage-sqlite" }

[lints]
workspace = true
